<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>greet-cli preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #131c2e;
        --border: #22304a;
        --ink: #e8eef8;
        --muted: #93a3bd;
        --accent: #7dd3fc;
        --ok: #6ee7a8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        background: radial-gradient(circle at 20% 0%, #16233c 0%, var(--bg) 55%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 760px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.4px;
      }
      h1 code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .badge {
        font-size: 12px;
        color: var(--accent);
        border: 1px solid var(--border);
        background: rgba(125, 211, 252, 0.08);
        border-radius: 999px;
        padding: 3px 10px;
      }
      p.lead {
        color: var(--muted);
        margin: 10px 0 24px;
        font-size: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      form {
        display: grid;
        grid-template-columns: 2fr 1fr auto auto;
        gap: 12px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: #0d1626;
        color: var(--ink);
        font-size: 15px;
        font-family: inherit;
      }
      input:focus {
        outline: 2px solid rgba(125, 211, 252, 0.45);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 4px;
        color: var(--ink);
        font-size: 15px;
        text-transform: none;
        letter-spacing: 0;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      button {
        padding: 11px 20px;
        border-radius: 9px;
        border: 0;
        background: var(--accent);
        color: #06263a;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .terminal {
        margin-top: 18px;
        background: #060c18;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.65;
        min-height: 120px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .prompt {
        color: var(--muted);
      }
      .out {
        color: var(--ok);
      }
      .err {
        color: #fca5a5;
      }
      .foot {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (max-width: 620px) {
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1><code>greet-cli</code></h1>
        <span class="badge">v{{VERSION}}</span>
      </header>
      <p class="lead">
        A tiny command-line tool that greets people. This page runs the real <code>greet</code> command and
        shows its output.
      </p>

      <section class="panel">
        <form id="greet-form">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" value="world" autocomplete="off" />
          </div>
          <div>
            <label for="times">Times</label>
            <input id="times" name="times" type="number" value="1" min="1" max="50" />
          </div>
          <div>
            <label for="shout">&nbsp;</label>
            <div class="check"><input id="shout" name="shout" type="checkbox" /> --shout</div>
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="submit" id="run">Run</button>
          </div>
        </form>

        <div class="terminal" id="output"><span class="prompt">$ </span>greet world</div>
      </section>

      <p class="foot">CLI usage: pip install . &amp;&amp; greet Alice --times 2 --shout</p>
    </main>

    <script>
      const form = document.getElementById("greet-form");
      const output = document.getElementById("output");
      const button = document.getElementById("run");

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);

      async function run(event) {
        if (event) event.preventDefault();
        button.disabled = true;
        try {
          const response = await fetch("/api/greet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("name").value || "world",
              times: Number(document.getElementById("times").value) || 1,
              shout: document.getElementById("shout").checked,
            }),
          });
          if (!response.ok) throw new Error("CLI preview request failed (" + response.status + ")");
          const data = await response.json();
          const body = data.lines.length
            ? data.lines.map((line) => '<span class="out">' + escapeHtml(line) + "</span>").join("\n")
            : '<span class="prompt">(no output)</span>';
          output.innerHTML = '<span class="prompt">$ ' + escapeHtml(data.command) + "</span>\n" + body;
        } catch (error) {
          output.innerHTML = '<span class="err">' + escapeHtml(error.message) + "</span>";
        } finally {
          button.disabled = false;
        }
      }

      form.addEventListener("submit", run);
      run();
    </script>
  </body>
</html>
